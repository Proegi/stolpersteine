<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2622">
<title>Stolpersteine Mainz</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --karte: rgba(255,255,255,.94);
    --text: #2b2622;
    --leise: #5e554d;
    --messing: #b8892f;
    --messing-dunkel: #8a6420;
    --stein: #2b2622;
    --ok: #2f7d4a;
    --fehler: #b23a2e;
    --rand: #d6cdc1;
    --radius: 1rem;
  }
  * { box-sizing: border-box; }
  html {
    font-size: clamp(18px, 4.9vw, 26px);
    -webkit-text-size-adjust: 100%;
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    font-size: 1rem;
    line-height: 1.5;
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
    background: #1e1b18;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(rgba(20,17,15,.62), rgba(20,17,15,.72)),
      url("hintergrund.jpg") center / cover no-repeat;
  }
  header {
    background: rgba(30,26,23,.92);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: #fff;
    padding: calc(.8rem + env(safe-area-inset-top)) 1rem .8rem;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    letter-spacing: .02em;
    display: flex;
    align-items: center;
    gap: .6rem;
  }
  .stein-icon {
    width: 1.2rem; height: 1.2rem;
    background: linear-gradient(135deg, #e0b863, var(--messing-dunkel));
    border-radius: 3px;
    flex: none;
  }
  .fortschritt { margin-top: .6rem; display: flex; gap: .3rem; }
  .fortschritt span {
    flex: 1;
    height: .4rem;
    border-radius: .2rem;
    background: #5a524b;
  }
  .fortschritt span.erledigt { background: var(--messing); }
  .fortschritt span.aktiv { background: #f0d18a; }
  .fortschritt-text { margin-top: .35rem; font-size: .8rem; color: #d8cfc4; }
  main {
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: 1rem .75rem 1.5rem;
  }
  .karte {
    background: var(--karte);
    border-radius: var(--radius);
    padding: 1.2rem 1rem;
    margin-bottom: 1rem;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  .etikett {
    display: inline-block;
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--messing-dunkel);
    font-weight: 600;
    margin-bottom: .25rem;
  }
  h2 { margin: 0 0 .4rem; font-size: 1.5rem; line-height: 1.2; }
  p { margin: 0 0 .8rem; }
  .adresse { color: var(--leise); font-size: .9rem; margin-bottom: .8rem; }
  button, .knopf {
    display: block;
    width: 100%;
    min-height: 3.2rem;
    padding: .8rem 1rem;
    border: none;
    border-radius: .8rem;
    font-size: 1.05rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .primaer { background: var(--messing); color: #fff; }
  .primaer:active { background: var(--messing-dunkel); }
  .sekundaer { background: #ece6dd; color: var(--text); }
  .sekundaer:active { background: #ddd5ca; }
  .knopfreihe { display: grid; gap: .65rem; margin-top: .8rem; }
  .raetsel {
    margin-top: 1rem;
    padding: 1rem;
    background: #faf6ef;
    border: 2px dashed var(--messing);
    border-radius: .8rem;
  }
  .raetsel[hidden] { display: none; }
  label { display: block; font-weight: 600; margin-bottom: .4rem; }
  input[type=text] {
    width: 100%;
    min-height: 3.2rem;
    padding: .7rem .9rem;
    font-size: 1.15rem;
    font-family: inherit;
    border: 2px solid var(--rand);
    border-radius: .8rem;
    background: #fff;
    color: var(--text);
  }
  input[type=text]:focus { outline: none; border-color: var(--messing); }
  .rueckmeldung { min-height: 1.5em; margin-top: .6rem; font-weight: 600; }
  .rueckmeldung.ok { color: var(--ok); }
  .rueckmeldung.fehler { color: var(--fehler); }
  .wackeln { animation: wackeln .35s; }
  @keyframes wackeln {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .kartenansicht {
    height: 55vh;
    min-height: 16rem;
    border-radius: .8rem;
    overflow: hidden;
    border: 1px solid var(--rand);
    margin: .6rem 0 .3rem;
  }
  .hinweis { font-size: .8rem; color: var(--leise); }
  details.bisher {
    background: var(--karte);
    border-radius: var(--radius);
    margin-bottom: .6rem;
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  details.bisher summary {
    padding: .9rem 1rem;
    cursor: pointer;
    font-weight: 600;
    list-style: none;
    display: flex;
    justify-content: space-between;
    gap: .6rem;
  }
  details.bisher summary::-webkit-details-marker { display: none; }
  details.bisher summary::after { content: "+"; color: var(--messing-dunkel); }
  details.bisher[open] summary::after { content: "\2212"; }
  details.bisher .inhalt { padding: 0 1rem .9rem; }
  .haken { color: var(--ok); margin-right: .4rem; }
  .nr {
    display: inline-block;
    min-width: 1.4rem; height: 1.4rem;
    margin-right: .5rem;
    border-radius: 50%;
    background: var(--stein);
    color: #fff;
    font-size: .75rem;
    line-height: 1.4rem;
    text-align: center;
    vertical-align: .1em;
  }
  .nr.leer { background: transparent; border: 2px solid var(--stein); }
  .weg { margin-top: 1rem; }
  .weg-titel {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--messing-dunkel);
    font-weight: 600;
    margin-bottom: .2rem;
  }
  details.randinfo { border-top: 1px solid var(--rand); }
  details.randinfo:last-child { border-bottom: 1px solid var(--rand); }
  details.randinfo summary {
    padding: .65rem 0;
    cursor: pointer;
    font-weight: 600;
    font-size: .95rem;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .6rem;
  }
  details.randinfo summary > span { display: flex; align-items: center; }
  details.randinfo .nr { flex: none; box-sizing: border-box; }
  details.randinfo summary::-webkit-details-marker { display: none; }
  details.randinfo summary::after { content: "+"; color: var(--messing-dunkel); font-size: 1.1rem; }
  details.randinfo[open] summary::after { content: "\2212"; }
  details.randinfo .inhalt { padding: 0 0 .8rem 1.9rem; }
  ul.punkte, ul.ablauf { margin: 0 0 .6rem; padding-left: 1.2rem; }
  ul.punkte li, ul.ablauf li { margin-bottom: .45rem; }
  ul.punkte { font-size: .9rem; }
  .lbl-ns { color: var(--fehler); font-weight: 600; }
  .lbl-info { color: #2a5d8a; font-weight: 600; }
  .quellen { font-size: .7rem; color: var(--leise); margin-bottom: .5rem; }
  .kleinlink { font-size: .85rem; color: var(--messing-dunkel); font-weight: 600; }
  .gruppen { margin: 1rem 0 .2rem; }
  .gruppen table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  .gruppen th, .gruppen td { text-align: left; padding: .45rem 0; border-top: 1px solid var(--rand); }
  .gruppen tr:last-child th, .gruppen tr:last-child td { border-bottom: 1px solid var(--rand); }
  .gruppen th { font-weight: 600; width: 45%; vertical-align: top; padding-right: .6rem; }
  .gruppen td { vertical-align: top; }
  .gruppen th .namen { font-weight: 400; font-size: .8rem; color: var(--leise); margin-top: .1rem; }
  .gruppen .kopf { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--leise); font-weight: 600; border-top: none; }
  .gruppen th { width: 70%; }
  .paten { font-size: .9rem; color: var(--leise); }
  details.randinfo .inhalt.mit-bild { display: flex; gap: .7rem; align-items: flex-start; }
  details.randinfo .inhalt .text { flex: 1; min-width: 0; }
  details.randinfo .bilder { flex: 0 0 34%; display: grid; gap: .4rem; }
  details.randinfo .bilder img { display: block; width: 100%; height: auto; border-radius: .5rem; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  /* Handy: Bilder über dem Text, nebeneinander */
  @media (max-width: 640px) {
    details.randinfo .inhalt.mit-bild { flex-direction: column; }
    details.randinfo .bilder { order: -1; flex: none; width: 100%; display: flex; gap: .4rem; }
    details.randinfo .bilder a { flex: 1; min-width: 0; }
    details.randinfo .bilder img { height: 11rem; object-fit: cover; }
  }
  .platzhalter {
    margin: .8rem 0 .2rem;
    padding: .8rem 1rem;
    border: 2px dashed var(--rand);
    border-radius: .8rem;
    color: var(--leise);
    font-size: .9rem;
  }
  .abschnitt-titel {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #f0e6d8;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
    margin: 1.6rem .25rem .6rem;
  }
  .ziel { text-align: center; }
  .ziel .gross { font-size: 3rem; line-height: 1; margin: .4rem 0 .8rem; color: var(--messing); }
  footer {
    max-width: 40rem;
    margin: 0 auto;
    padding: .5rem .75rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .zahnrad {
    width: 2.6rem;
    min-height: 2.6rem;
    height: 2.6rem;
    padding: .5rem;
    border-radius: 50%;
    background: rgba(255,255,255,.18);
    color: #f0e6d8;
  }
  .zahnrad svg { width: 100%; height: 100%; display: block; }
  .zahnrad[aria-expanded=true] { background: rgba(255,255,255,.35); }
  .einstellungen {
    width: 100%;
    margin-top: .6rem;
    padding: 1rem;
    background: var(--karte);
    border-radius: var(--radius);
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  .einstellungen[hidden] { display: none; }
  .leaflet-container { font-family: inherit; font-size: .8rem; }
  .leaflet-control-zoom a { width: 2.4rem !important; height: 2.4rem !important; line-height: 2.4rem !important; font-size: 1.3rem !important; }
</style>
</head>

<header>
  <h1><span class="stein-icon"></span>Stolpersteine Mainz</h1>
  <div class="fortschritt" id="fortschritt"></div>
  <div class="fortschritt-text" id="fortschrittText"></div>
</header>

<main id="app"></main>

<footer>
  <button class="zahnrad" id="btnZahnrad" type="button" aria-label="Einstellungen" aria-expanded="false" aria-controls="einstellungen">

  </button>
  <div class="einstellungen" id="einstellungen" hidden>

</footer>

// phase: "vorort" = an Station index, Rätsel offen
//        "unterwegs" = Station index gelöst, Weg zu index+1
//        "fertig" = alles gelöst
let stand = laden();

function laden() {
  try {
    const s = JSON.parse(localStorage.getItem(SPEICHER));
    if (s && typeof s.index === "number") return s;
  } catch (e) {}
  return { index: 0, phase: "vorort", raetselOffen: false };
}
function speichern() {
  try { localStorage.setItem(SPEICHER, JSON.stringify(stand)); } catch (e) {}
}

// Zahl aus freier Eingabe lesen: "40000", "40.000", "40 000", "ca. 40k", "40 tausend"
function zahlLesen(t) {
  t = String(t).toLocaleLowerCase("de").replace(/\s+/g, "");
  const m = t.match(/(\d+(?:[.,]\d+)*)(k|tsd\.?|tausend)?/);
  if (!m) return NaN;
  let z = m[1];
  if (m[2]) z = parseFloat(z.replace(",", "."));               // 40k, 40,5tausend
  else z = parseFloat(z.replace(/[.,](?=\d{3}(\D|$))/g, "").replace(",", "."));
  return m[2] ? z * 1000 : z;
}

// Antwortprüfung: antwort (exakt), enthaelt (Stichwort irgendwo in der Eingabe), bereich [von, bis]
function pruefen(s, eingabe) {
  if (s.bereich) {
    const z = zahlLesen(eingabe);
    return z >= s.bereich[0] && z <= s.bereich[1];
  }
  const e = normalisieren(eingabe, s.grossKlein);
  if (s.enthaelt) return e !== "" && s.enthaelt.some(w => e.includes(normalisieren(w, s.grossKlein)));
  return e === normalisieren(s.antwort, s.grossKlein);
}

function normalisieren(t, grossKlein) {
  t = String(t).trim().replace(/\s+/g, " ");
  return grossKlein ? t : t.toLocaleLowerCase("de");
}

/* ---------- Darstellung ---------- */

function esc(t) {
  return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function abstand(a, b) {
  const dx = (a.lng - b.lng) * Math.cos(a.lat * Math.PI / 180), dy = a.lat - b.lat;
  return Math.sqrt(dx * dx + dy * dy);
}

// Zwischenstopps mit Koordinaten auf dem Weg zu Station "nach"
function wegpunkte(nach) {
  return (nach.unterwegs || []).filter(u => typeof u.lat === "number");
}

// Fußweg-Link über alle Zwischenstopps; Google Maps erlaubt max. 9 Wegpunkte,
// bei mehr werden die Punkte weggelassen, die am dichtesten am vorherigen liegen.
function navLink(von, nach) {
  let wp = wegpunkte(nach).slice();
  while (wp.length > 9) {
    let min = Infinity, idx = 0;
    for (let i = 0; i < wp.length; i++) {
      const vorher = i === 0 ? von : wp[i - 1];
      const d = abstand(vorher, wp[i]);
      if (d < min) { min = d; idx = i; }
    }
    wp.splice(idx, 1);
  }
  let url = "https://www.google.com/maps/dir/?api=1&origin=" + von.lat + "," + von.lng +
    "&destination=" + nach.lat + "," + nach.lng + "&travelmode=walking";
  if (wp.length) url += "&waypoints=" + encodeURIComponent(wp.map(p => p.lat + "," + p.lng).join("|"));
  return url;
}

function punktLink(p) {
  return "https://www.google.com/maps/dir/?api=1&destination=" + p.lat + "," + p.lng + "&travelmode=walking";
}

const LABELS = /^(NS-Zeit|Gut zu wissen|Hinweis|Rallye-Tipp|Besucher-Tipp|Impuls für die Gruppe|Brücke zur Tour|Heutige Erinnerungskultur):\s*/;
function punktHtml(t) {
  const m = t.match(LABELS);
  if (!m) return "<li>" + esc(t) + "</li>";
  const k = m[1] === "NS-Zeit" ? "lbl-ns" : "lbl-info";
  return '<li><span class="' + k + '">' + esc(m[1]) + ':</span> ' + esc(t.slice(m[0].length)) + "</li>";
}

        'Gestrichelte Linie = Luftlinie. Für den Fußweg die Navigation öffnen.</div>' +
      unterwegsHtml(nach) +
      '<div class="knopfreihe">' +
        '<a class="knopf sekundaer" href="' + navLink(von, nach) + '" target="_blank" rel="noopener">Fußweg in Karten-App öffnen</a>' +
        '<button class="primaer" id="btnDa" type="button">Wir sind angekommen</button>' +
      '</div>' +
      '</section>';
  }

  // bisherige Stationen
  const bisAnzahl = stand.phase === "fertig" ? STATIONEN.length : stand.index + (stand.phase === "unterwegs" ? 1 : 0);
  if (bisAnzahl > 0) {
    html += '<div class="abschnitt-titel">Bisherige Stationen</div>';
    for (let i = 0; i < bisAnzahl; i++) {
      const s = STATIONEN[i];
      html += '<details class="bisher"><summary><span><span class="haken">&#10003;</span>' +
        esc(s.titel) + '</span></summary>' +
        '<div class="inhalt"><div class="adresse">' + esc(s.adresse) + '</div>' +
        (s.text ? '<p>' + esc(s.text) + '</p>' : '') + '</div></details>';
    }
  }

  app.innerHTML = html;
  window.scrollTo(0, 0);
  ereignisseBinden();
}

function ereignisseBinden() {
  const btnStart = document.getElementById("btnStart");
  if (btnStart) btnStart.addEventListener("click", () => {
    stand.raetselOffen = true;
    speichern();
    btnStart.hidden = true;
    document.getElementById("raetsel").hidden = false;
    document.getElementById("antwort").focus();
  });

  const btnWeiter = document.getElementById("btnWeiter");
  if (btnWeiter) btnWeiter.addEventListener("click", () => {
    stand.phase = stand.index === STATIONEN.length - 1 ? "fertig" : "unterwegs";
    stand.raetselOffen = false;
    speichern();
    zeichnen();
  });

  const form = document.getElementById("formAntwort");
  if (form) form.addEventListener("submit", e => {
    e.preventDefault();
    const s = STATIONEN[stand.index];
    const feld = document.getElementById("antwort");
    const rm = document.getElementById("rueckmeldung");
    // DEBUG: "test" wird bei jeder Frage zusätzlich als richtig akzeptiert
    if (pruefen(s, feld.value) || normalisieren(feld.value, false) === "test") {
      rm.className = "rueckmeldung ok";
      rm.textContent = "Richtig!";
      feld.blur();
      setTimeout(() => {
        stand.phase = stand.index === STATIONEN.length - 1 ? "fertig" : "unterwegs";
        stand.raetselOffen = false;
        speichern();
        zeichnen();
      }, 700);
    } else {
      rm.className = "rueckmeldung fehler";
      rm.textContent = feld.value.trim() === "" ? "Bitte eine Antwort eingeben." : "Leider nicht richtig. Versucht es noch einmal.";
      feld.classList.remove("wackeln");
      void feld.offsetWidth;
      feld.classList.add("wackeln");
    }
  });

  const btnDa = document.getElementById("btnDa");
  if (btnDa) btnDa.addEventListener("click", () => {
    stand.index += 1;
    stand.phase = "vorort";
    stand.raetselOffen = false;
    speichern();
    zeichnen();
  });

  if (document.getElementById("karte")) karteZeichnen();
}

function karteZeichnen() {
  const von = STATIONEN[stand.index];
  const nach = STATIONEN[stand.index + 1];
  if (typeof L === "undefined") {
    document.getElementById("karte").innerHTML = '<p style="padding:12px">Karte konnte nicht geladen werden. Bitte den Link zur Karten-App nutzen.</p>';
    return;
  }
  const karte = L.map("karte", { zoomControl: true, attributionControl: true });
  aktiveKarte = karte;
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(karte);

  const punktVon = L.circleMarker([von.lat, von.lng], { radius: 8, color: "#6b625a", fillColor: "#ffffff", fillOpacity: 1, weight: 3 })
    .addTo(karte).bindPopup("Hier seid ihr: " + esc(von.titel));
  const punktNach = L.marker([nach.lat, nach.lng], {
    icon: L.divIcon({
      className: "",
      html: '<div style="width:26px;height:26px;border-radius:4px;background:linear-gradient(135deg,#e0b863,#8a6420);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',
      iconSize: [26, 26], iconAnchor: [13, 13]
    })
  }).addTo(karte).bindPopup("Ziel: " + esc(nach.titel));
  const wp = wegpunkte(nach);
  const linie = [[von.lat, von.lng]].concat(wp.map(p => [p.lat, p.lng]), [[nach.lat, nach.lng]]);
  L.polyline(linie, { color: "#b8892f", weight: 4, dashArray: "8 8" }).addTo(karte);
  wp.forEach((p, i) => {
    L.marker([p.lat, p.lng], {
      icon: L.divIcon({
        className: "",
        html: '<div style="width:22px;height:22px;border-radius:50%;background:#2b2622;color:#fff;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);font:600 12px/18px system-ui,sans-serif;text-align:center">' + (i + 1) + '</div>',
        iconSize: [22, 22], iconAnchor: [11, 11]
      })
    }).addTo(karte).bindPopup((i + 1) + ". " + esc(p.titel));
  });
  karte.fitBounds(L.latLngBounds(linie), { padding: [40, 40] });
  punktNach.openPopup();

}

const btnZahnrad = document.getElementById("btnZahnrad");
btnZahnrad.addEventListener("click", () => {
  const panel = document.getElementById("einstellungen");
  panel.hidden = !panel.hidden;
  btnZahnrad.setAttribute("aria-expanded", String(!panel.hidden));
  if (!panel.hidden) panel.scrollIntoView({ behavior: "smooth", block: "end" });
});

document.getElementById("btnReset").addEventListener("click", () => {
  if (confirm("Wirklich alle Eingaben und den Fortschritt löschen? Der Rundgang beginnt dann wieder bei Station 1.")) {
    try { localStorage.removeItem(SPEICHER); } catch (e) {}
    stand = { index: 0, phase: "vorort", raetselOffen: false };
    document.getElementById("einstellungen").hidden = true;
    btnZahnrad.setAttribute("aria-expanded", "false");
    zeichnen();
  }
});

zeichnen();
</script>

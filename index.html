<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2622">
<title>Stolpersteine Mainz</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --karte: rgba(255,255,255,.94);
    --text: #2b2622;
    --leise: #5e554d;
    --messing: #b8892f;
    --messing-dunkel: #8a6420;
    --stein: #2b2622;
    --ok: #2f7d4a;
    --fehler: #b23a2e;
    --rand: #d6cdc1;
    --radius: 1rem;
  }
  * { box-sizing: border-box; }
  html {
    font-size: clamp(18px, 4.9vw, 26px);
    -webkit-text-size-adjust: 100%;
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    font-size: 1rem;
    line-height: 1.5;
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
    background: #1e1b18;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(rgba(20,17,15,.62), rgba(20,17,15,.72)),
      url("hintergrund.jpg") center / cover no-repeat;
  }
  header {
    background: rgba(30,26,23,.92);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: #fff;
    padding: calc(.8rem + env(safe-area-inset-top)) 1rem .8rem;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    letter-spacing: .02em;
    display: flex;
    align-items: center;
    gap: .6rem;
  }
  .stein-icon {
    width: 1.2rem; height: 1.2rem;
    background: linear-gradient(135deg, #e0b863, var(--messing-dunkel));
    border-radius: 3px;
    flex: none;
  }
  .fortschritt { margin-top: .6rem; display: flex; gap: .3rem; }
  .fortschritt span {
    flex: 1;
    height: .4rem;
    border-radius: .2rem;
    background: #5a524b;
  }
  .fortschritt span.erledigt { background: var(--messing); }
  .fortschritt span.aktiv { background: #f0d18a; }
  .fortschritt-text { margin-top: .35rem; font-size: .8rem; color: #d8cfc4; }
  main {
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: 1rem .75rem 1.5rem;
  }
  .karte {
    background: var(--karte);
    border-radius: var(--radius);
    padding: 1.2rem 1rem;
    margin-bottom: 1rem;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  .etikett {
    display: inline-block;
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--messing-dunkel);
    font-weight: 600;
    margin-bottom: .25rem;
  }
  h2 { margin: 0 0 .4rem; font-size: 1.5rem; line-height: 1.2; }
  p { margin: 0 0 .8rem; }
  .adresse { color: var(--leise); font-size: .9rem; margin-bottom: .8rem; }
  button, .knopf {
    display: block;
    width: 100%;
    min-height: 3.2rem;
    padding: .8rem 1rem;
    border: none;
    border-radius: .8rem;
    font-size: 1.05rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .primaer { background: var(--messing); color: #fff; }
  .primaer:active { background: var(--messing-dunkel); }
  .sekundaer { background: #ece6dd; color: var(--text); }
  .sekundaer:active { background: #ddd5ca; }
  .knopfreihe { display: grid; gap: .65rem; margin-top: .8rem; }
  .raetsel {
    margin-top: 1rem;
    padding: 1rem;
    background: #faf6ef;
    border: 2px dashed var(--messing);
    border-radius: .8rem;
  }
  .raetsel[hidden] { display: none; }
  label { display: block; font-weight: 600; margin-bottom: .4rem; }
  input[type=text] {
    width: 100%;
    min-height: 3.2rem;
    padding: .7rem .9rem;
    font-size: 1.15rem;
    font-family: inherit;
    border: 2px solid var(--rand);
    border-radius: .8rem;
    background: #fff;
    color: var(--text);
  }
  input[type=text]:focus { outline: none; border-color: var(--messing); }
  .rueckmeldung { min-height: 1.5em; margin-top: .6rem; font-weight: 600; }
  .rueckmeldung.ok { color: var(--ok); }
  .rueckmeldung.fehler { color: var(--fehler); }
  .wackeln { animation: wackeln .35s; }
  @keyframes wackeln {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .kartenansicht {
    height: 55vh;
    min-height: 16rem;
    border-radius: .8rem;
    overflow: hidden;
    border: 1px solid var(--rand);
    margin: .6rem 0 .3rem;
  }
  .hinweis { font-size: .8rem; color: var(--leise); }
  details.bisher {
    background: var(--karte);
    border-radius: var(--radius);
    margin-bottom: .6rem;
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  details.bisher summary {
    padding: .9rem 1rem;
    cursor: pointer;
    font-weight: 600;
    list-style: none;
    display: flex;
    justify-content: space-between;
    gap: .6rem;
  }
  details.bisher summary::-webkit-details-marker { display: none; }
  details.bisher summary::after { content: "+"; color: var(--messing-dunkel); }
  details.bisher[open] summary::after { content: "\2212"; }
  details.bisher .inhalt { padding: 0 1rem .9rem; }
  .haken { color: var(--ok); margin-right: .4rem; }
  .abschnitt-titel {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #f0e6d8;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
    margin: 1.6rem .25rem .6rem;
  }
  .ziel { text-align: center; }
  .ziel .gross { font-size: 3rem; line-height: 1; margin: .4rem 0 .8rem; color: var(--messing); }
  footer {
    max-width: 40rem;
    margin: 0 auto;
    padding: .5rem .75rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .zahnrad {
    width: 2.6rem;
    min-height: 2.6rem;
    height: 2.6rem;
    padding: .5rem;
    border-radius: 50%;
    background: rgba(255,255,255,.18);
    color: #f0e6d8;
  }
  .zahnrad svg { width: 100%; height: 100%; display: block; }
  .zahnrad[aria-expanded=true] { background: rgba(255,255,255,.35); }
  .einstellungen {
    width: 100%;
    margin-top: .6rem;
    padding: 1rem;
    background: var(--karte);
    border-radius: var(--radius);
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  .einstellungen[hidden] { display: none; }
  .schalter {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    font-weight: 600;
    margin: 0 0 .9rem;
    cursor: pointer;
  }
  .schalter input { width: 1.6rem; height: 1.6rem; accent-color: var(--messing); flex: none; }
  .leaflet-container { font-family: inherit; font-size: .8rem; }
  .leaflet-control-zoom a { width: 2.4rem !important; height: 2.4rem !important; line-height: 2.4rem !important; font-size: 1.3rem !important; }
</style>
</head>
<body>

<header>
  <h1><span class="stein-icon"></span>Stolpersteine Mainz</h1>
  <div class="fortschritt" id="fortschritt"></div>
  <div class="fortschritt-text" id="fortschrittText"></div>
</header>

<main id="app"></main>

<footer>
  <button class="zahnrad" id="btnZahnrad" type="button" aria-label="Einstellungen" aria-expanded="false" aria-controls="einstellungen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <div class="einstellungen" id="einstellungen" hidden>
    <label class="schalter" for="optStandort">Meinen Standort auf der Karte zeigen
      <input type="checkbox" id="optStandort">
    </label>
    <button class="sekundaer" id="btnReset" type="button">Alle Eingaben löschen</button>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ---------- Stationen (Dummy) ----------
   antwort: erwartete Lösung
   grossKlein: true = Groß-/Kleinschreibung zählt (Standard: egal)
*/
const STATIONEN = [
  {
    titel: "Treffpunkt Hauptbahnhof",
    adresse: "Bahnhofplatz, vor dem Haupteingang",
    lat: 50.00105, lng: 8.25900,
    text: "Hier beginnt unser Rundgang. Platzhaltertext für die Begrüßung und eine kurze Einführung in das Thema.",
    frage: "Platzhalter-Rätsel für den Start. (Dummy-Lösung: test)",
    antwort: "test",
    grossKlein: false
  },
  {
    titel: "Eugen Salomon",
    adresse: "Boppstraße 64, Stolperstein vor dem Haus",
    lat: 50.00630, lng: 8.25570,
    text: "Platzhaltertext. Thema: Eugen Salomon, Mitgründer des 1. FSV Mainz 05 (1905), hier liegt sein Stolperstein.",
    frage: "Platzhalter-Rätsel zu Eugen Salomon. (Dummy-Lösung: test)",
    antwort: "test",
    grossKlein: false
  },
  {
    titel: "Exportierte Revolution",
    adresse: "Platz der Mainzer Republik, vor dem Deutschhaus",
    lat: 50.00510, lng: 8.27110,
    text: "Platzhaltertext. Thema: Mainzer Republik, Jakobiner, Freiheitsbaum, 18. März, Bundespräsident, Nationalfeiertag.",
    frage: "Platzhalter-Rätsel zur Mainzer Republik. (Dummy-Lösung: test)",
    antwort: "test",
    grossKlein: false
  },
  {
    titel: "Dalberger Hof",
    adresse: "Klarastraße 4",
    lat: 50.00170, lng: 8.26982,
    text: "Platzhaltertext. Thema: Ein Mainzer Adelshof, Gefängnis, Luxuswohnungen.",
    frage: "Platzhalter-Rätsel zum Dalberger Hof. (Dummy-Lösung: test)",
    antwort: "test",
    grossKlein: false
  },
  {
    titel: "Man of the Millennium",
    adresse: "Gutenbergplatz, am Gutenberg-Denkmal",
    lat: 49.99885, lng: 8.27159,
    text: "Platzhaltertext. Thema: Revolutionär, Handwerker, Geschäftsmann, Wegbereiter der Moderne.",
    frage: "Platzhalter-Rätsel zum Man of the Millennium. (Dummy-Lösung: test)",
    antwort: "test",
    grossKlein: false
  },
  {
    titel: "Gouvernement",
    adresse: "Schillerplatz 1, vor dem Osteiner Hof (Gouvernement)",
    lat: 49.99742, lng: 8.26819,
    text: "Platzhaltertext. Thema: Gouvernement, Braunes Haus, 11.11.",
    frage: "Platzhalter-Rätsel zum Gouvernement. (Dummy-Lösung: test)",
    antwort: "test",
    grossKlein: false
  },
  {
    titel: "Kommunistin im Exil",
    adresse: "Parcusstraße, Gedenktafel am Geburtshaus (Ort vorläufig)",
    lat: 50.00157, lng: 8.26155,
    text: "Platzhaltertext. Thema: Literarisches Denkmal, Das siebte Kreuz.",
    frage: "Platzhalter-Rätsel zur Kommunistin im Exil. (Dummy-Lösung: test)",
    antwort: "test",
    grossKlein: false
  },
  {
    titel: "Zurück am Hauptbahnhof",
    adresse: "Bahnhofplatz, vor dem Haupteingang",
    lat: 50.00105, lng: 8.25900,
    text: "Wir sind wieder am Ausgangspunkt. Platzhaltertext für den Abschluss.",
    frage: "Platzhalter-Abschlussrätsel. (Dummy-Lösung: test)",
    antwort: "test",
    grossKlein: false
  }
];

/* ---------- Fortschritt ---------- */
const SPEICHER = "stolpersteine-mainz-v2";
// phase: "vorort" = an Station index, Rätsel offen
//        "unterwegs" = Station index gelöst, Weg zu index+1
//        "fertig" = alles gelöst
let stand = laden();

function laden() {
  try {
    const s = JSON.parse(localStorage.getItem(SPEICHER));
    if (s && typeof s.index === "number") return s;
  } catch (e) {}
  return { index: 0, phase: "vorort", raetselOffen: false };
}
function speichern() {
  try { localStorage.setItem(SPEICHER, JSON.stringify(stand)); } catch (e) {}
}

function normalisieren(t, grossKlein) {
  t = String(t).trim().replace(/\s+/g, " ");
  return grossKlein ? t : t.toLocaleLowerCase("de");
}

/* ---------- Darstellung ---------- */
const app = document.getElementById("app");
let aktiveKarte = null;

function esc(t) {
  return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function navLink(s) {
  return "https://www.google.com/maps/dir/?api=1&destination=" + s.lat + "," + s.lng + "&travelmode=walking";
}

function fortschrittZeichnen() {
  const leiste = document.getElementById("fortschritt");
  const n = STATIONEN.length;
  let html = "";
  for (let i = 0; i < n; i++) {
    let k = "";
    if (stand.phase === "fertig" || i < stand.index || (i === stand.index && stand.phase === "unterwegs")) k = "erledigt";
    else if (i === stand.index) k = "aktiv";
    html += '<span class="' + k + '"></span>';
  }
  leiste.innerHTML = html;
  const geloest = stand.phase === "fertig" ? n : stand.index + (stand.phase === "unterwegs" ? 1 : 0);
  document.getElementById("fortschrittText").textContent = geloest + " von " + n + " Stationen gelöst";
}

function zeichnen() {
  standortStoppen();
  if (aktiveKarte) { aktiveKarte.remove(); aktiveKarte = null; }
  fortschrittZeichnen();
  let html = "";

  if (stand.phase === "fertig") {
    html += '<section class="karte ziel">' +
      '<div class="etikett">Geschafft</div>' +
      '<div class="gross">&#9632;</div>' +
      '<h2>Rundgang abgeschlossen</h2>' +
      '<p>Platzhaltertext für den Abschluss des Rundgangs.</p>' +
      '</section>';
  } else if (stand.phase === "vorort") {
    const s = STATIONEN[stand.index];
    html += '<section class="karte">' +
            '<h2>' + esc(s.titel) + '</h2>' +
      '<div class="adresse">' + esc(s.adresse) + '</div>' +
      '<p>' + esc(s.text) + '</p>' +
      '<button class="primaer" id="btnStart" type="button"' + (stand.raetselOffen ? ' hidden' : '') + '>Rätsel starten</button>' +
      '<div class="raetsel" id="raetsel"' + (stand.raetselOffen ? '' : ' hidden') + '>' +
        '<p>' + esc(s.frage) + '</p>' +
        '<form id="formAntwort" autocomplete="off">' +
          '<label for="antwort">Eure Antwort</label>' +
          '<input type="text" id="antwort" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">' +
          '<div class="knopfreihe"><button class="primaer" type="submit">Antwort prüfen</button></div>' +
          '<div class="rueckmeldung" id="rueckmeldung" aria-live="polite"></div>' +
        '</form>' +
      '</div>' +
      '</section>';
  } else {
    const von = STATIONEN[stand.index];
    const nach = STATIONEN[stand.index + 1];
    html += '<section class="karte">' +
      '<div class="etikett">Richtig gelöst</div>' +
      '<h2>Auf zur nächsten Station</h2>' +
      '<p>Euer nächstes Ziel: <span style="font-weight:600">' + esc(nach.titel) + '</span><br>' +
      '<span class="adresse">' + esc(nach.adresse) + '</span></p>' +
      '<div class="kartenansicht" id="karte"></div>' +
      '<div class="hinweis">Gestrichelte Linie = Luftlinie. Für den Fußweg die Navigation öffnen.</div>' +
      '<div class="knopfreihe">' +
        '<a class="knopf sekundaer" href="' + navLink(nach) + '" target="_blank" rel="noopener">Fußweg in Karten-App öffnen</a>' +
        '<button class="primaer" id="btnDa" type="button">Wir sind angekommen</button>' +
      '</div>' +
      '</section>';
  }

  // bisherige Stationen
  const bisAnzahl = stand.phase === "fertig" ? STATIONEN.length : stand.index + (stand.phase === "unterwegs" ? 1 : 0);
  if (bisAnzahl > 0) {
    html += '<div class="abschnitt-titel">Bisherige Stationen</div>';
    for (let i = 0; i < bisAnzahl; i++) {
      const s = STATIONEN[i];
      html += '<details class="bisher"><summary><span><span class="haken">&#10003;</span>' +
        esc(s.titel) + '</span></summary>' +
        '<div class="inhalt"><div class="adresse">' + esc(s.adresse) + '</div>' +
        '<p>' + esc(s.text) + '</p></div></details>';
    }
  }

  app.innerHTML = html;
  window.scrollTo(0, 0);
  ereignisseBinden();
}

function ereignisseBinden() {
  const btnStart = document.getElementById("btnStart");
  if (btnStart) btnStart.addEventListener("click", () => {
    stand.raetselOffen = true;
    speichern();
    btnStart.hidden = true;
    document.getElementById("raetsel").hidden = false;
    document.getElementById("antwort").focus();
  });

  const form = document.getElementById("formAntwort");
  if (form) form.addEventListener("submit", e => {
    e.preventDefault();
    const s = STATIONEN[stand.index];
    const feld = document.getElementById("antwort");
    const rm = document.getElementById("rueckmeldung");
    if (normalisieren(feld.value, s.grossKlein) === normalisieren(s.antwort, s.grossKlein)) {
      rm.className = "rueckmeldung ok";
      rm.textContent = "Richtig!";
      feld.blur();
      setTimeout(() => {
        stand.phase = stand.index === STATIONEN.length - 1 ? "fertig" : "unterwegs";
        stand.raetselOffen = false;
        speichern();
        zeichnen();
      }, 700);
    } else {
      rm.className = "rueckmeldung fehler";
      rm.textContent = feld.value.trim() === "" ? "Bitte eine Antwort eingeben." : "Leider nicht richtig. Versucht es noch einmal.";
      feld.classList.remove("wackeln");
      void feld.offsetWidth;
      feld.classList.add("wackeln");
    }
  });

  const btnDa = document.getElementById("btnDa");
  if (btnDa) btnDa.addEventListener("click", () => {
    stand.index += 1;
    stand.phase = "vorort";
    stand.raetselOffen = false;
    speichern();
    zeichnen();
  });

  if (document.getElementById("karte")) karteZeichnen();
}

function karteZeichnen() {
  const von = STATIONEN[stand.index];
  const nach = STATIONEN[stand.index + 1];
  if (typeof L === "undefined") {
    document.getElementById("karte").innerHTML = '<p style="padding:12px">Karte konnte nicht geladen werden. Bitte den Link zur Karten-App nutzen.</p>';
    return;
  }
  const karte = L.map("karte", { zoomControl: true, attributionControl: true });
  aktiveKarte = karte;
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(karte);

  const punktVon = L.circleMarker([von.lat, von.lng], { radius: 8, color: "#6b625a", fillColor: "#ffffff", fillOpacity: 1, weight: 3 })
    .addTo(karte).bindPopup("Hier seid ihr: " + esc(von.titel));
  const punktNach = L.marker([nach.lat, nach.lng], {
    icon: L.divIcon({
      className: "",
      html: '<div style="width:26px;height:26px;border-radius:4px;background:linear-gradient(135deg,#e0b863,#8a6420);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',
      iconSize: [26, 26], iconAnchor: [13, 13]
    })
  }).addTo(karte).bindPopup("Ziel: " + esc(nach.titel));
  L.polyline([[von.lat, von.lng], [nach.lat, nach.lng]], { color: "#b8892f", weight: 4, dashArray: "8 8" }).addTo(karte);
  karte.fitBounds(L.latLngBounds([[von.lat, von.lng], [nach.lat, nach.lng]]), { padding: [40, 40] });
  punktNach.openPopup();

  if (einstellung.standort) standortVerfolgen();
}

/* ---------- Einstellungen ---------- */
const EINST = "stolpersteine-mainz-einstellungen";
let einstellung = { standort: false };
try { Object.assign(einstellung, JSON.parse(localStorage.getItem(EINST)) || {}); } catch (e) {}
let ortWatch = null, ortMarker = null;

function standortVerfolgen() {
  if (!aktiveKarte || !navigator.geolocation) return;
  const karte = aktiveKarte;
  let ersterTreffer = true;
  standortStoppen();
  ortWatch = navigator.geolocation.watchPosition(pos => {
    if (aktiveKarte !== karte) return;
    const p = [pos.coords.latitude, pos.coords.longitude];
    if (ortMarker) ortMarker.setLatLng(p);
    else ortMarker = L.circleMarker(p, { radius: 9, color: "#fff", fillColor: "#2a6fdb", fillOpacity: 1, weight: 3 }).addTo(karte).bindPopup("Euer Standort");
    if (ersterTreffer) {
      const nach = STATIONEN[stand.index + 1];
      karte.fitBounds(L.latLngBounds([p, [nach.lat, nach.lng]]), { padding: [40, 40] });
      ersterTreffer = false;
    }
  }, () => {}, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
}
function standortStoppen() {
  if (ortWatch !== null && navigator.geolocation) navigator.geolocation.clearWatch(ortWatch);
  ortWatch = null;
  ortMarker = null;
}

const optStandort = document.getElementById("optStandort");
optStandort.checked = einstellung.standort;
optStandort.addEventListener("change", () => {
  einstellung.standort = optStandort.checked;
  try { localStorage.setItem(EINST, JSON.stringify(einstellung)); } catch (e) {}
  if (einstellung.standort) standortVerfolgen();
  else { if (ortMarker && aktiveKarte) aktiveKarte.removeLayer(ortMarker); standortStoppen(); }
});

const btnZahnrad = document.getElementById("btnZahnrad");
btnZahnrad.addEventListener("click", () => {
  const panel = document.getElementById("einstellungen");
  panel.hidden = !panel.hidden;
  btnZahnrad.setAttribute("aria-expanded", String(!panel.hidden));
  if (!panel.hidden) panel.scrollIntoView({ behavior: "smooth", block: "end" });
});

document.getElementById("btnReset").addEventListener("click", () => {
  if (confirm("Wirklich alle Eingaben und den Fortschritt löschen? Der Rundgang beginnt dann wieder bei Station 1.")) {
    try { localStorage.removeItem(SPEICHER); } catch (e) {}
    stand = { index: 0, phase: "vorort", raetselOffen: false };
    document.getElementById("einstellungen").hidden = true;
    btnZahnrad.setAttribute("aria-expanded", "false");
    zeichnen();
  }
});

zeichnen();
</script>
